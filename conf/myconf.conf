# 搜索引擎配置文件
# 格式：key = value，以 '#' 开头的行为注释
# 在线配置由 Configuration 解析；索引根目录及旧词典路径相对本配置文件所在目录

# ---------- 语料库 ----------
# 英文语料目录（仅包含英文正文语料）
en_corpus_dir = ../docs/模块一/yuliao/english
# 中文语料目录（仅包含中文正文语料）
cn_corpus_dir = ../docs/模块一/yuliao/chinese
# 人民网语料目录（PageLib 构建网页库时使用）
ripe_page_dir = ../docs/模块二/人民网语料
# 停用词文件
stop_words_en = ../docs/模块一/yuliao/stop_words/stop_words_eng.txt
stop_words_zh = ../docs/模块一/yuliao/stop_words/stop_words_zh.txt

# ---------- 离线部分产物 ----------
# 正式推荐服务加载 CURRENT 指向的四文件完整词库版本
keyword_index_root = ../data/keyword_index
# 词典
dict_path = ../data/dict.dat
# 单词所在位置的索引库
dict_index_path = ../data/dictIndex.dat
# 下列四条旧路径供单语言工具和旧配置参考；正式服务优先使用 keyword_index_root
en_dict_path = ../data/en_dict.dat
en_dict_index_path = ../data/en_index.dat
# 独立中文词典与字符索引（build_chinese_keywords 生成）
cn_dict_path = ../data/cn_dict.dat
cn_dict_index_path = ../data/cn_index.dat
# 在线服务启动时加载 CURRENT 指向的完整网页索引快照
web_index_root = ../data/web_index

# ---------- 中文分词 ----------
# 当前环境已安装的 cppjieba 资源目录
jieba_dict_dir = /usr/local/dict
jieba_main_dict_path = /usr/local/dict/jieba.dict.utf8
jieba_hmm_path = /usr/local/dict/hmm_model.utf8
jieba_user_dict_path = /usr/local/dict/user.dict.utf8
jieba_idf_path = /usr/local/dict/idf.utf8
jieba_stop_words_path = /usr/local/dict/stop_words.utf8

# ---------- 在线服务 ----------
# 服务器监听地址与端口
server_ip = 0.0.0.0
server_port = 8888
# 线程池：工作线程数、任务队列缓冲区大小
thread_num = 4
buf_size = 10
# 推荐服务的请求限制（正式 searchengine 在线服务已接入）
default_top_k = 5
max_top_k = 20
max_query_chars = 64
max_body_bytes = 4096
max_json_depth = 8
max_inflight_per_connection = 16
shutdown_drain_timeout_ms = 5000

# ---------- 缓存 ----------
# 每个工作线程对应一个 LRUCache，容量与线程数一致
cache_capacity = 1000
# 缓存落盘文件
cache_file = ../data/cache.dat
# 定时更新缓存的间隔（秒）
cache_update_interval = 60

# ---------- Redis ----------
redis_ip = 127.0.0.1
redis_port = 6379

# ---------- 日志 ----------
log_path = ../log/searchengine.log
